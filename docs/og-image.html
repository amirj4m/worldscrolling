<!doctype html>
<!-- Source for assets/img/og-image.png (1200x630). Re-render with headless Chrome — see README. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
/* #181717 = background of jam's logo-dark.jpg, so the logo blends seamlessly */
body{background:#181717;color:#fff7ee;font-family:"Bricolage Grotesque",system-ui,sans-serif;position:relative}
.logo{position:absolute;left:190px;top:-84px;width:820px;-webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 50%,#000 72%,transparent 100%);mask-image:radial-gradient(ellipse 62% 58% at 50% 50%,#000 72%,transparent 100%)}
.word{position:absolute;left:0;right:0;top:268px;text-align:center;font-weight:800;font-size:78px;letter-spacing:-.045em;color:#fff7ee}
h1{position:absolute;left:0;right:0;top:390px;text-align:center;margin:0;font-size:62px;line-height:1.05;letter-spacing:-.04em;font-weight:800}
s{text-decoration:none;position:relative;color:rgba(255,247,238,.55)}
s::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:.14em;background:#ff5b2e;border-radius:99px;transform:rotate(-4deg)}
em{font-style:normal;color:#d8ff3c}
.url{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:22px;font-weight:600;color:rgba(255,247,238,.5)}
</style></head><body>
<img class="logo" src="../assets/img/logo-dark.jpg" alt="">
<div class="word">worldscrolling</div>
<div class="url">worldscrolling.com</div>
<h1>Don't scroll the <s>screen</s>.<br><em>Scroll the world.</em></h1>
</body></html>
